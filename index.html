<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Viewport configured for full screen mobile native feel & safe areas -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#347357" />

  <!-- Montserrat Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">

  <!-- Apple iOS PWA Mobile Web App setup -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Securities" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <title>Gateshark Securities</title>
  <style>
    #static-splash {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #347357;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99998;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #static-splash img {
      width: 150px;
      height: auto;
    }

    #static-splash .splash-subtitle {
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      margin-top: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <div id="static-splash">
    <img src="/splash/gateshark-logo-white.png" alt="GateShark Logo" />
    <div class="splash-subtitle">Gateshark</div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Hide static splash screen once React mounts
    window.addEventListener('DOMContentLoaded', () => {
      const staticSplash = document.getElementById('static-splash');
      if (staticSplash) staticSplash.remove();
    });
  </script>
</body>

</html>
